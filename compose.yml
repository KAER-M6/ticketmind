services:
  ticketmind:
    build: .
    image: ticketmind:0.2
    container_name: ticketmind
    ports:
      - "8000:8000"
    env_file:
      - .env                      # DEEPSEEK_API_KEY 从这里注入（不随镜像分发）
    environment:
      TICKETMIND_IMPORT_WORKERS: "6"
      TICKETMIND_CORS_ORIGINS: "http://127.0.0.1:8000,http://localhost:8000"
      # 生产内网部署时打开鉴权：
      # TICKETMIND_API_KEY: "change-me"
    volumes:
      - ./data:/app/data                        # 业务库 + 反馈池持久化，容器重建不丢
      - hf_cache:/root/.cache/huggingface       # MiniLM 模型缓存，避免每次重新下载
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hf_cache:
